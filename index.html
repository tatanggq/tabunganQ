<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabungan Anak</title>
    <style>
        :root { --p: #2e7d32; --p-l: #e8f5e9; --s: #00796b; --d: #212121; --l: #eef2f3; }
        * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--l); color: var(--d); padding: 20px; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 480px; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .card { background: linear-gradient(135deg, var(--p), var(--s)); color: white; padding: 25px; border-radius: 16px; text-align: center; margin-bottom: 25px; }
        .grid { display: flex; gap: 10px; margin-bottom: 25px; }
        .btn { flex: 1; background: var(--p-l); border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: bold; color: var(--p); text-align: center; font-size: 14px; }
        .btn:hover { background: #c8e6c9; }
        .modal { display: none; background: #fff; border: 2px solid var(--p); padding: 20px; border-radius: 16px; margin-bottom: 25px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; }
        .btn-sub { width: 100%; padding: 12px; background: var(--p); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .history { list-style: none; max-height: 200px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 5px; }
        .item { display: flex; justify-content: space-between; padding: 12px 10px; border-bottom: 1px solid #f5f5f5; font-size: 14px; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="text-align:center; color:var(--p);">🌱 Tabungan Anak</h2>
    <p style="text-align:center; font-size:12px; color:#666; margin-bottom:20px;">Aplikasi Celengan Interaktif</p>

    <div class="card">
        <h3 style="font-size:13px; opacity:0.9;">SALDO ANDA</h3>
        <div style="font-size:34px; font-weight:700; margin: 5px 0;" id="v-saldo">Rp 0</div>
        <div style="font-size:12px; background:rgba(255,255,255,0.2); display:inline-block; padding:4px 12px; border-radius:20px;">Akad: Wadiah (Titipan)</div>
    </div>

    <!-- Tombol Menu Menggunakan Fungsi Onclick Langsung -->
    <div class="grid">
        <button class="btn" onclick="bukaForm('setor')">➕ Setor Tunai</button>
        <button class="btn" onclick="bukaForm('tarik')">➖ Tarik Tunai</button>
        <button class="btn" onclick="bukaForm('transfer')">➔ Transfer</button>
    </div>

    <!-- Halaman Pengisian Mandiri untuk Anak -->
    <div class="modal" id="panel-form">
        <h3 id="form-title" style="margin-bottom:15px; border-bottom:2px solid var(--p-l); padding-bottom:5px;">Form</h3>
        <div class="form-group">
            <label>👦 Jumlah Uang yang Diinput Anak (Rp):</label>
            <input type="number" id="in-uang" placeholder="Contoh: 1000">
        </div>
        <div class="form-group" id="div-tujuan" style="display:none;">
            <label>👦 Kirim Ke (Nama Penerima):</label>
            <input type="text" id="in-tujuan" placeholder="Contoh: Kakak / Adek">
        </div>
        <div class="form-group">
            <label>👦 Alasan / Keterangan:</label>
            <input type="text" id="in-ket" placeholder="Contoh: Jajan">
        </div>
        <button class="btn-sub" onclick="prosesValidasi()">Konfirmasi Transaksi</button>
        <button style="width:100%; margin-top:8px; background:#e0e0e0; border:none; padding:8px; border-radius:8px; cursor:pointer;" onclick="tutupForm()">Batal</button>
    </div>

    <div>
        <h3 style="font-size:16px; margin-bottom:10px; color:#444;">📜 Buku Mutasi Tabungan</h3>
        <ul id="log-list" class="history"></ul>
        <div style="text-align:center; margin-top:20px;">
            <span style="font-size:12px; color:#757575; cursor:pointer; text-decoration:underline;" onclick="resetSistem()">⚙️ Reset Total Sistem</span>
        </div>
    </div>
</div>

<script>
    let saldo = parseInt(localStorage.getItem('s_saldo')) || 0;
    let log = JSON.parse(localStorage.getItem('s_log')) || [];
    let menu = "";
    const PIN_ORTU = "12345678"; // PIN Anda selaku server orangtua

    // Muat data saat web dibuka
    renderLayar();

    function bukaForm(opsi) {
        menu = opsi;
        document.getElementById('panel-form').style.display = 'block';
        document.getElementById('in-uang').value = '';
        document.getElementById('in-ket').value = '';
        document.getElementById('in-tujuan').value = '';

        if(opsi === 'setor') {
            document.getElementById('form-title').innerText = "💰 Form Setor Tunai Celengan";
            document.getElementById('div-tujuan').style.display = 'none';
        } else if(opsi === 'tarik') {
            document.getElementById('form-title').innerText = "💵 Form Tarik Tunai Celengan";
            document.getElementById('div-tujuan').style.display = 'none';
        } else if(opsi === 'transfer') {
            document.getElementById('form-title').innerText = "💸 Form Transfer Dana";
            document.getElementById('div-tujuan').style.display = 'block';
        }
    }

    function tutupForm() {
        document.getElementById('panel-form').style.display = 'none';
    }

    function prosesValidasi() {
        let nominal = parseInt(document.getElementById('in-uang').value);
        let catatan = document.getElementById('in-ket').value || '-';
        let target = document.getElementById('in-tujuan').value;

        if(!nominal || nominal <= 0) {
            alert("Harap masukkan nominal uang yang valid!");
            return;
        }
        if((menu === 'tarik' || menu === 'transfer') && nominal > saldo) {
            alert("⚠️ Saldo tidak mencukupi untuk melakukan transaksi ini.");
            return;
        }

        // PANGGIL ORANG TUA SECARA FISIK MELALUI POP-UP SISTEM
        let aksiFisik = menu === 'setor' ? 'serahkan uang fisiknya' : 'ambil uang fisiknya';
        let pin = prompt(`📢 Panggil Ayah/Bunda, ${aksiFisik} sebesar Rp ${nominal.toLocaleString('id-ID')}.\n\n🧕 SERVER ORANGTUA - MASUKKAN PIN ORTU:`);

        if (pin === null) return;
        if (pin !== PIN_ORTU) {
            alert("⚠️ PIN Server Induk Salah! Transaksi otomatis dibatalkan.");
            return;
        }

        // Jalankan Perhitungan Uang jika PIN Benar
        let infoLog = catatan;
        if(menu === 'setor') { saldo += nominal; infoLog = "Setor: " + catatan; }
        else if(menu === 'tarik') { saldo -= nominal; infoLog = "Tarik: " + catatan; }
        else if(menu === 'transfer') { saldo -= nominal; infoLog = `Trf ke ${target}: ` + catatan; }

        let tgl = new Date().toLocaleString('id-ID', {dateStyle: 'short', timeStyle: 'short'});
        log.unshift({ aksi: menu, uang: nominal, detail: infoLog, waktu: tgl });

        localStorage.setItem('s_saldo', saldo);
        localStorage.setItem('s_log', JSON.stringify(log));

        tutupForm();
        renderLayar();
        alert("✅ Transaksi Sukses Diverifikasi Server Induk!");
    }

    function renderLayar() {
        document.getElementById('v-saldo').innerText = "Rp " + saldo.toLocaleString('id-ID');
        let html = "";
        log.forEach(item => {
            let isPlus = item.aksi === 'setor';
            html += `<li class="item">
                <div><strong>${item.detail}</strong><br><small style="color:#999;">${item.waktu}</small></div>
                <div style="font-weight:bold; color:${isPlus?'#2e7d32':'#d32f2f'}">${isPlus?'+':'-'} Rp ${item.uang.toLocaleString('id-ID')}</div>
            </li>`;
        });
        document.getElementById('log-list').innerHTML = html || '<p style="text-align:center; padding:15px; color:#aaa; font-size:13px;">Belum ada riwayat.</p>';
    }

    function resetSistem() {
        let pin = prompt("🧕 SERVER Orangtua - Masukkan PIN Anda:");
        if (pin === PIN_ORTU) {
            localStorage.clear(); saldo = 0; log = []; renderLayar(); tutupForm(); alert("Sistem di-reset.");
        } else if (pin !== null) { alert("PIN Salah!"); }
    }
</script>
</body>
</html>
