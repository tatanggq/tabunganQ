<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabungan Anak</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 450px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { text-align: center; color: #2e7d32; margin-bottom: 20px; }
        .saldo-box { background: #2e7d32; color: white; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 20px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { flex: 1; padding: 15px 10px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; color: white; text-align: center; font-size: 14px; }
        .btn-setor { background-color: #4caf50; }
        .btn-tarik { background-color: #f44336; }
        .btn-trf { background-color: #008cba; }
        .history { border-top: 2px solid #eee; padding-top: 15px; }
        .history h3 { font-size: 16px; margin-bottom: 10px; color: #333; }
        .log-item { display: flex; justify-content: space-between; padding: 8px 5px; border-bottom: 1px solid #f1f1f1; font-size: 14px; }
    </style>
</head>
<body>

<div class="box">
    <div class="header">
        <h2>🌱 Tabungan Anak</h2>
        <small>Aplikasi Celengan</small>
    </div>

    <div class="saldo-box">
        <div style="font-size: 14px; opacity: 0.9;">SALDO MURNI</div>
        <div style="font-size: 32px; font-weight: bold; margin: 5px 0;" id="v-saldo">Rp 0</div>
        <div style="font-size: 12px; background: rgba(0,0,0,0.2); display:inline-block; padding: 3px 10px; border-radius: 10px;">Akad: Wadiah (Titipan Murni)</div>
    </div>

    <!-- Tombol Menggunakan Aksi Pop-up Langsung -->
    <div class="btn-group">
        <button class="btn btn-setor" onclick="aksiMenu('setor')">➕ Setor Tunai</button>
        <button class="btn btn-tarik" onclick="aksiMenu('tarik')">➖ Tarik Tunai</button>
        <button class="btn btn-trf" onclick="aksiMenu('transfer')">➔ Transfer</button>
    </div>

    <div class="history">
        <h3>📜 Buku Catatan Mutasi</h3>
        <div id="log-list"></div>
        <button onclick="bersihkanSistem()" style="margin-top:30px; background:none; border:none; color:red; text-decoration:underline; cursor:pointer; font-size:11px; width:100%; text-align:center;">Reset Semua Data</button>
    </div>
</div>

<script>
    let dbSaldo = parseInt(localStorage.getItem('db_saldo')) || 0;
    let dbLog = JSON.parse(localStorage.getItem('db_log')) || [];
    const PIN_ORTU = "12345678"; 

    // Muat data layar utama
    renderLayar();

    function aksiMenu(pilihan) {
        // 1. Validasi PIN Ortu di awal menggunakan Pop-up Windows
        let pinUser = prompt("🔑 MASUKKAN PIN SERVER INDUK (ORTU):");
        if (pinUser === null) return; // Jika klik batal
        if (pinUser !== PIN_ORTU) {
            alert("⚠️ PIN Salah! Akses ditolak oleh Server Induk.");
            return;
        }

        // 2. Tanya Nominal Uang
        let inputUang = prompt("💰 Masukkan Jumlah Uang (Rp):\n(Masukkan angka saja tanpa titik/koma)");
        if (inputUang === null) return;
        let nominal = parseInt(inputUang);
        if (!nominal || nominal <= 0) {
            alert("⚠️ Nominal uang tidak valid!");
            return;
        }

        // 3. Tanya Keterangan Tambahan / Tujuan Transfer
        let tujuan = "";
        let keterangan = "";
        if (pilihan === 'transfer') {
            tujuan = prompt("💸 Transfer Ke Siapa? (Nama Penerima):");
            if (tujuan === null || tujuan.trim() === "") return;
        }
        
        keterangan = prompt("📝 Tulis Keterangan / Catatan Singkat:", "Sisa uang saku");
        if (keterangan === null) keterangan = "-";

        // 4. Cek kecukupan saldo jika melakukan penarikan/transfer
        if ((pilihan === 'tarik' || pilihan === 'transfer') && nominal > dbSaldo) {
            alert("⚠️ Transaksi Gagal! Saldo tabungan anak tidak mencukupi.");
            return;
        }

        // 5. Eksekusi Aritmatika
        let pesanLog = "";
        if (pilihan === 'setor') {
            dbSaldo += nominal;
            pesanLog = "Setor: " + keterangan;
        } else if (pilihan === 'tarik') {
            dbSaldo -= nominal;
            pesanLog = "Tarik: " + keterangan;
        } else if (pilihan === 'transfer') {
            dbSaldo -= nominal;
            pesanLog = `Trf ke ${tujuan}: ` + keterangan;
        }

        // 6. Simpan Riwayat Permanen ke Browser
        let tgl = new Date().toLocaleDateString('id-ID') + " " + new Date().toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
        dbLog.unshift({ aksi: pilihan, uang: nominal, detail: pesanLog, waktu: tgl });

        localStorage.setItem('db_saldo', dbSaldo);
        localStorage.setItem('db_log', JSON.stringify(dbLog));

        renderLayar();
        alert("✅ BERHASIL! Server induk sukses memperbarui saldo anak.");
    }

    function renderLayar() {
        document.getElementById('v-saldo').innerText = "Rp " + dbSaldo.toLocaleString('id-ID');
        
        let kontainerLog = "";
        dbLog.forEach(item => {
            let warna = item.aksi === 'setor' ? 'green' : 'red';
            let simbol = item.aksi === 'setor' ? '+' : '-';
            kontainerLog += `<div class="log-item">
                <div>
                    <strong>${item.detail}</strong><br>
                    <small style="color:#999;">${item.waktu}</small>
                </div>
                <div style="color:${warna}; font-weight:bold;">
                    ${simbol} Rp ${item.uang.toLocaleString('id-ID')}
                </div>
            </div>`;
        });
        
        document.getElementById('log-list').innerHTML = kontainerLog || '<p style="color:#aaa; text-align:center; font-size:13px; padding:10px;">Belum ada riwayat keuangan.</p>';
    }

    function bersihkanSistem() {
        let pinUser = prompt("🔑 Masukkan PIN Ortu untuk menghapus total data:");
        if (pinUser === PIN_ORTU) {
            localStorage.clear();
            dbSaldo = 0;
            dbLog = [];
            renderLayar();
            alert("Sistem berhasil di-reset.");
        } else if (pinUser !== null) {
            alert("PIN Salah!");
        }
    }
</script>

</body>
</html>
